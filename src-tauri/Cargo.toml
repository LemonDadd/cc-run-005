[package]
name = "kidmath"
version = "1.0.0"
description = "KidMath 儿童数学启蒙游戏"
authors = ["KidMath"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kidmath_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kidmath-core = { path = "core" }

[profile.release]
# 体积与启动速度对桌面儿童应用都很重要。
panic = "abort"
codegen-units = 1
lto = true
incremental = false
