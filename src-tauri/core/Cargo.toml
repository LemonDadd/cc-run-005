[package]
name = "kidmath-core"
version = "1.0.0"
edition = "2021"

[lib]
name = "kidmath_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# 独立包，避免被上层 src-tauri 当作 workspace 成员一并编译
# （Tauri 壳依赖本 crate，但本 crate 不依赖任何系统 GUI 库，便于纯命令行测核心逻辑）。
[workspace]
